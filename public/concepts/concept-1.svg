<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" role="img" aria-label="Nova Rampa Konsept 1 - Ramp N Hybrid">
  <!-- N harfi: sol vertical + diagonal (13° rampa) + sağ vertical -->
  <!-- Sol vertical -->
  <rect x="20" y="20" width="16" height="80" fill="#14233A"/>
  <!-- Diagonal stroke — 13° eğimli, TURUNCU (rampa vurgusu) -->
  <polygon points="36,20 36,42 80,100 80,78" fill="#F97316"/>
  <!-- Sağ vertical -->
  <rect x="80" y="20" width="16" height="80" fill="#14233A"/>

  <!-- Mikro gap -->
  <rect x="96" y="20" width="4" height="80" fill="none"/>

  <!-- R harfi -->
  <!-- Sol vertical -->
  <rect x="100" y="20" width="16" height="80" fill="#14233A"/>
  <!-- Üst horizontal -->
  <rect x="100" y="20" width="56" height="16" fill="#14233A"/>
  <!-- Sağ üst kavis (right vertical) -->
  <rect x="140" y="20" width="16" height="44" fill="#14233A"/>
  <!-- Orta bar -->
  <rect x="100" y="50" width="56" height="14" fill="#14233A"/>
  <!-- Alt diagonal bacak -->
  <polygon points="134,60 152,60 176,100 158,100" fill="#14233A"/>

  <!-- Zemin çizgisi (subtle) -->
  <line x1="10" y1="108" x2="190" y2="108" stroke="#14233A" stroke-width="1" stroke-opacity="0.25"/>
</svg>
