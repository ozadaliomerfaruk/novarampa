<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Nova Rampa Konsept 2 - Trapezoid NR Cutout">
  <!--
    Ziraat-tarzı dual meaning:
    Trapezoid (rampa profili) ana form,
    içinde NR harfleri negative space ile kesilmiş.
  -->
  <defs>
    <mask id="cut-nr">
      <!-- Beyaz alan görünür kalır -->
      <rect width="100%" height="100%" fill="white"/>
      <!-- NR harfleri siyah = bunlar trapezoid'ten kesilir -->
      <!-- N -->
      <rect x="40"  y="48" width="10" height="60" fill="black"/>
      <polygon points="50,48 50,68 78,108 78,88" fill="black"/>
      <rect x="78"  y="48" width="10" height="60" fill="black"/>
      <!-- R -->
      <rect x="96"  y="48" width="10" height="60" fill="black"/>
      <rect x="96"  y="48" width="34" height="10" fill="black"/>
      <rect x="120" y="48" width="10" height="28" fill="black"/>
      <rect x="96"  y="68" width="34" height="10" fill="black"/>
      <polygon points="116,76 132,76 150,108 134,108" fill="black"/>
    </mask>
  </defs>

  <!-- Yer çizgisi -->
  <line x1="10" y1="148" x2="190" y2="148" stroke="#14233A" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Trapezoid (rampa profili) — sol kenar eğimli, NAVY -->
  <path
    d="M 14 140 L 186 140 L 186 32 L 76 32 Z"
    fill="#14233A"
    mask="url(#cut-nr)"
  />

  <!-- Üst platform load çizgileri (TURUNCU vurgu, rampanın üstünde) -->
  <line x1="76" y1="24" x2="186" y2="24" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="96" y1="14" x2="186" y2="14" stroke="#F97316" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
</svg>
